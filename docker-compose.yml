services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: audio-converter-tailscale
    restart: unless-stopped
    environment:
      # Auth key from https://login.tailscale.com/admin/settings/keys.
      # Leave blank to log in manually with 'docker compose exec tailscale tailscale up'.
      TS_AUTHKEY: "${TS_AUTHKEY:-}"
      TS_HOSTNAME: "${TS_HOSTNAME:-audio-converter}"
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
    volumes:
      - tailscale_state:/var/lib/tailscale

  audio-converter:
    build: .
    container_name: audio-converter
    restart: unless-stopped
    # Share the Tailscale sidecar's network namespace. The web interface is
    # then reachable only through the tailnet, with no ports published.
    network_mode: "service:tailscale"
    depends_on:
      - tailscale
    environment:
      TZ: "${TZ:-Asia/Seoul}"
      SOURCE_DIRECTORY: /music/source
      OUTPUT_DIRECTORY: /music/output
      # Five-field cron expression. Default: every day at 03:00.
      CRON_SCHEDULE: "${CRON_SCHEDULE:-0 3 * * *}"
      # Run once immediately after the container starts, then follow CRON_SCHEDULE.
      RUN_ON_START: "${RUN_ON_START:-true}"
      # Examples: "--format alac" or "-s --format mp3". Blank converts all formats.
      CONVERTER_ARGS: "${CONVERTER_ARGS:-}"
    volumes:
      - type: bind
        source: "${HOST_SOURCE_DIRECTORY:-./music_original}"
        target: /music/source
        read_only: true
      - type: bind
        source: "${HOST_OUTPUT_DIRECTORY:-./music}"
        target: /music/output

volumes:
  tailscale_state:
